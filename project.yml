name: SignApp
options:
  bundleIdPrefix: com.cd-rail
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: SignApp
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SignApp:
    type: application
    platform: iOS
    sources:
      - path: ios/SignApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cd-rail.zhct
        INFOPLIST_KEY_CFBundleDisplayName: SignApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
